    <path d="M832 50 Q862 35 897 45 Q927 55 942 75 Q952 95 937 110 Q947 130 927 145 Q902 155 877 145 Q852 150 837 130 Q822 105 827 80 Q824 65 832 50 Z"/>

    <!-- "Australia"-ish small blob, centered ~410 -->
    <ellipse cx="410" cy="170" rx="28" ry="16"/>
    <ellipse cx="-102" cy="170" rx="28" ry="16"/>
    <ellipse cx="922" cy="170" rx="28" ry="16"/>
  </g>

  <!-- polar ice caps -->
  <rect x="0" y="0" width="512" height="14" fill="#eaf4fb" opacity="0.85"/>
