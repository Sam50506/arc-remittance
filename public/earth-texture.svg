    <path d="M235 45 Q255 35 268 48 Q278 60 272 78 Q285 95 280 130 Q275 165 258 190 Q245 200 235 185 Q225 160 230 130 Q218 95 225 70 Q228 55 235 45 Z"/>
    <path d="M-277 45 Q-257 35 -244 48 Q-234 60 -240 78 Q-227 95 -232 130 Q-237 165 -254 190 Q-267 200 -277 185 Q-287 160 -282 130 Q-294 95 -287 70 Q-284 55 -277 45 Z"/>
